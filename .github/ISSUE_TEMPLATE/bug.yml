name: Bug
description: Something works differently from what the app says or shows.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Keep it short and specific. In English, please.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: |
        1. Open the app
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Browser and device
      placeholder: Chrome 142 on Android 16
