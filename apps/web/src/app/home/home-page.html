<div class="scroll-glass flex h-dvh flex-col overflow-y-auto p-3 md:p-4">
  <header class="flex justify-end">
    <app-theme-toggle />
  </header>

  <main class="flex flex-1 items-center justify-center py-6">
    <section appGlass class="flex w-full max-w-md animate-appear flex-col items-center gap-6 rounded-[2rem] motion-reduce:animate-none px-6 py-10 text-center md:px-10">
      <span
        class="grid size-14 place-items-center rounded-2xl border border-edge bg-glass-strong text-accent-ink"
        aria-hidden="true"
      >
        <svg lucideHourglass class="size-7"></svg>
      </span>
      <div class="flex flex-col gap-2">
        <h1 class="text-3xl font-semibold tracking-tight md:text-4xl">Ephemeral Chat</h1>
        <p class="text-ink-soft">Create a room, share the link, talk. Nothing is kept.</p>
      </div>
      <div class="flex flex-col items-center gap-3">
        <button
          type="button"
          class="flex items-center gap-2 rounded-full bg-accent px-7 py-3 font-medium text-on-accent shadow-lift transition hover:scale-105 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-ink disabled:hover:scale-100"
          [disabled]="state() === 'creating'"
          [attr.aria-busy]="state() === 'creating'"
          (click)="createRoom()"
        >
          @if (state() === 'creating') {
            <svg lucideLoaderCircle class="size-4 animate-spin motion-reduce:animate-none" aria-hidden="true"></svg>
            Creating room…
          } @else {
            Create room
          }
        </button>
        @if (state() === 'failed') {
          <p class="text-sm text-danger-ink" role="alert">
            Couldn't create a room. Check your connection and try again.
          </p>
        }
      </div>
      <ul class="flex flex-wrap justify-center gap-x-5 gap-y-2 text-xs text-ink-soft">
        <li class="flex items-center gap-1.5">
          <svg lucideUserX class="size-4" aria-hidden="true"></svg>
          No accounts
        </li>
        <li class="flex items-center gap-1.5">
          <svg lucideShieldCheck class="size-4" aria-hidden="true"></svg>
          Nothing stored
        </li>
        <li class="flex items-center gap-1.5">
          <svg lucideLink class="size-4" aria-hidden="true"></svg>
          The link is the key
        </li>
      </ul>
    </section>
  </main>
</div>
