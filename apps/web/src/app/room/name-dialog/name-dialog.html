<dialog
  #dialog
  appGlass
  class="m-auto w-[calc(100%-1.5rem)] max-w-sm rounded-[2rem] p-6 text-ink backdrop:bg-black/20 md:p-8"
  aria-labelledby="name-title"
  (cancel)="$event.preventDefault()"
>
  <form class="flex flex-col gap-4" [formRoot]="nameForm">
    <div class="flex flex-col gap-1">
      <h2 id="name-title" class="text-xl font-semibold">What's your name?</h2>
      <p class="text-sm text-ink-soft">It's how others will see you in this room.</p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="name" class="text-xs font-medium text-ink-soft">Name</label>
      <input
        id="name"
        class="rounded-full border border-edge bg-glass-strong px-5 py-3 placeholder:text-ink-soft focus-visible:outline-2 focus-visible:outline-accent"
        placeholder="Ana"
        autocomplete="off"
        [formField]="nameForm.name"
      />
      @if (taken(); as name) {
        <p class="text-sm text-red-700 dark:text-red-300" role="alert">{{ name }} is already in this room. Pick another name.</p>
      }
      @if (nameForm.name().touched() && nameForm.name().invalid()) {
        <p class="text-sm text-red-700 dark:text-red-300" role="alert">Enter a name, up to {{ maxLength }} characters.</p>
      }
    </div>

    <button
      type="submit"
      class="rounded-full bg-accent px-6 py-3 font-medium text-on-accent shadow-[0_8px_24px_-8px_var(--accent)] transition hover:scale-[1.02] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
    >
      Join
    </button>
  </form>
</dialog>
