<dialog
  #dialog
  appGlass
  class="m-auto w-[calc(100%-1.5rem)] max-w-sm rounded-[2rem] p-0 text-ink animate-appear backdrop:animate-fade backdrop:bg-scrim motion-reduce:animate-none motion-reduce:backdrop:animate-none"
  aria-labelledby="name-title"
  (cancel)="cancel($event)"
  (click)="cancelOutside($event)"
>
  <form class="flex flex-col gap-4 p-6 md:p-8" [formRoot]="nameForm">
    <div class="flex flex-col gap-1">
      <h2 id="name-title" class="text-xl font-semibold">
        {{ 'nameDialog.' + kind() + '.heading' | transloco }}
      </h2>
      <p class="text-sm text-ink-soft">{{ 'nameDialog.' + kind() + '.hint' | transloco }}</p>
    </div>

    <div class="flex flex-col gap-2">
      <label for="name" class="text-xs font-medium text-ink-soft">{{
        'nameDialog.' + kind() + '.label' | transloco
      }}</label>
      <input
        id="name"
        class="rounded-full border border-edge bg-glass-strong/50 px-5 py-3 focus-visible:outline-2 focus-visible:outline-accent-ink"
        autocomplete="off"
        [formField]="nameForm.name"
      />
      @if (nameForm.name().touched() && nameForm.name().invalid()) {
        <p class="text-sm text-danger-ink" role="alert">
          {{ 'nameDialog.invalid' | transloco: { max: maxLength } }}
        </p>
      }
    </div>

    <button
      type="submit"
      appGlass="primary"
      class="rounded-full px-6 py-3 font-semibold shadow-lift transition hover:scale-[1.02] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent-ink"
    >
      {{ 'nameDialog.' + kind() + '.action' | transloco }}
    </button>
    <button
      type="button"
      class="-mt-1 rounded-full px-6 py-2 text-sm font-medium text-ink-soft transition hover:bg-glass-strong focus-visible:outline-2 focus-visible:outline-accent-ink"
      (click)="cancel($event)"
    >
      {{ 'nameDialog.cancel' | transloco }}
    </button>
  </form>
</dialog>
