@let active = client.active();
<div appVisibleViewport class="relative flex h-dvh md:gap-4 md:p-4">
  <app-chat-list
    appGlass
    role="navigation"
    [attr.aria-label]="'chats' | transloco"
    class="m-2 min-w-0 flex-1 flex-col gap-4 rounded-3xl p-4 md:m-0 md:flex md:w-96 md:flex-none"
    [class.flex]="!active"
    [class.hidden]="active"
    [chats]="client.chats()"
    [active]="active?.id ?? null"
    [me]="client.me()"
    [name]="client.name()"
    (selected)="select($event)"
    (newGroup)="creating.set(true)"
    (opened)="join($event)"
    (showQr)="qr.set('private')"
    (rename)="renaming.set(true)"
  />

  @if (active) {
    <app-room-chat
      [status]="client.status()"
      [title]="active.title"
      [kind]="active.kind"
      [ended]="active.ended"
      [events]="active.events"
      [members]="active.members"
      [me]="client.me()"
      [code]="active.id"
      [link]="link(active.id)"
      [typing]="active.typing"
      [focus]="joined() === active.id"
      (sent)="client.send(active.id, $event.text, $event.reply)"
      [preview]="client.picked()"
      (attached)="client.pick(active.id, $event)"
      (filesSent)="client.sendPicked($event.items, $event.original)"
      (filesDiscarded)="client.discardPicked()"
      (voiced)="client.sendVoice(active.id, $event.blob, $event.seconds, $event.reply)"
      (typed)="client.sendTyping(active.id)"
      (reconnect)="client.reconnect()"
      (showQr)="qr.set('group')"
      (closed)="client.open(null)"
      (deleted)="client.remove(active.id)"
    />
  } @else {
    <app-chats-welcome
      class="hidden"
      [class.md:flex]="client.name() && !creating()"
      (newGroup)="creating.set(true)"
      (showQr)="qr.set('private')"
      [me]="client.me()"
    />
  }

  @if (notice.text(); as text) {
    <p
      appGlass="bubble"
      role="status"
      class="absolute top-[calc(env(safe-area-inset-top)+4.5rem)] left-1/2 z-20 flex max-w-[calc(100%-2rem)] -translate-x-1/2 animate-appear items-center gap-2 rounded-full px-4 py-2 text-sm font-medium motion-reduce:animate-none md:top-24"
    >
      @if (notice.done()) {
        <svg lucideCheck class="size-4 shrink-0 text-accent-ink" aria-hidden="true"></svg>
      } @else {
        <svg lucideInfo class="size-4 shrink-0 text-ink-soft" aria-hidden="true"></svg>
      }
      {{ text }}
    </p>
  }

  @if (qr() === 'private') {
    <app-qr-dialog kind="private" [url]="invite()" (closed)="qr.set(null)" />
  }

  @if (qr() === 'group' && active) {
    <app-qr-dialog
      kind="group"
      [title]="active.title"
      [url]="link(active.id)"
      (closed)="qr.set(null)"
    />
  }

  @if (creating()) {
    <app-name-dialog kind="group" (chosen)="create($event)" (dismissed)="creating.set(false)" />
  }

  @if (renaming()) {
    <app-name-dialog
      kind="name"
      [initial]="client.name() ?? ''"
      (chosen)="rename($event)"
      (dismissed)="renaming.set(false)"
    />
  }
</div>
